name: Build experimental Morphe MPP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - '.github/workflows/build-mpp.yml'
permissions:
  contents: write
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: addon
      - name: Checkout Morphe official template
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches-template
          ref: main
          path: template
      - name: Inject the independent patch
        run: |
          rm -rf template/patches/src/main/kotlin/app/template/patches/example
          mkdir -p template/patches/src/main/kotlin/dev/itolkien/captions/patches
          cp addon/patches/src/main/kotlin/dev/itolkien/captions/patches/*.kt template/patches/src/main/kotlin/dev/itolkien/captions/patches/
          mkdir -p template/extensions/extension/src/main/java/dev/itolkien/captions/extension
          cp addon/extensions/extension/src/main/java/dev/itolkien/captions/extension/*.java template/extensions/extension/src/main/java/dev/itolkien/captions/extension/
          # Use an updated bundle version so Manager can distinguish old incompatible artifacts.
          sed -i 's/^version = .*/version = 1.2.0/' template/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p=Path("template/patches/build.gradle.kts")
          s=p.read_text()
          s=s.replace('group = "app.template"', 'group = "dev.itolkien.captions"')
          s=s.replace('name = "UserXYZ Patches"', 'name = "Morphe Universal Captions (Experimental)"')
          s=s.replace('description = "Patches for apps I like"', 'description = "Experimental YouTube-native caption integration probes"')
          s=s.replace('source = "git@github.com:UserXYZ/morphe-patches.git"', 'source = "https://github.com/itolkien/morphe-universal-captions"')
          s=s.replace('author = "Awesome dev"', 'author = "itolkien"')
          s=s.replace('contact = "na"', 'contact = "https://github.com/itolkien/morphe-universal-captions/issues"')
          s=s.replace('website = "na"', 'website = "https://github.com/itolkien/morphe-universal-captions"')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build installable patch bundle
        working-directory: template
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon
          find patches/build/libs -maxdepth 1 -name '*.mpp' -type f -printf '%f\n'
      - name: Upload Morphe Manager MPP (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: universal-captions-1.2.0-youtube-mpp
          path: template/patches/build/libs/patches-1.2.0.mpp
          if-no-files-found: error
          retention-days: 14

      - name: Publish YouTube-scoped MPP release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp template/patches/build/libs/patches-1.2.0.mpp universal-captions-1.2.0.mpp
          if ! gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.2.0 universal-captions-1.2.0.mpp \\
              --repo "$GITHUB_REPOSITORY" \\
              --target "$GITHUB_SHA" \\
              --title "Universal Captions v1.2.0 - YouTube" \\
              --notes "Experimental YouTube-native auto-translation unlock. Verified by a user on YouTube 21.20.405. Supports additional languages through native caption-track cloning. Compatibility metadata targets YouTube, not universal apps. Always retain a working APK backup; other YouTube versions are unverified."
          fi
