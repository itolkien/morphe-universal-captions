name: Build Universal Captions MPP
on:
  workflow_dispatch:
  push:
    branches: [main, experiment/source-track-selection]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - '.github/workflows/build-mpp.yml'
permissions:
  contents: write
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: addon
      - name: Checkout Morphe official template
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches-template
          ref: main
          path: template
      - name: Inject the independent patch
        run: |
          rm -rf template/patches/src/main/kotlin/app/template/patches/example
          mkdir -p template/patches/src/main/kotlin/dev/itolkien/captions/patches
          cp addon/patches/src/main/kotlin/dev/itolkien/captions/patches/*.kt template/patches/src/main/kotlin/dev/itolkien/captions/patches/
          mkdir -p template/extensions/extension/src/main/java/dev/itolkien/captions/extension
          cp addon/extensions/extension/src/main/java/dev/itolkien/captions/extension/*.java template/extensions/extension/src/main/java/dev/itolkien/captions/extension/
          # Use an updated bundle version so Manager can distinguish old incompatible artifacts.
          sed -i 's/^version = .*/version = 1.3.0/' template/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p=Path("template/patches/build.gradle.kts")
          s=p.read_text()
          s=s.replace('group = "app.template"', 'group = "dev.itolkien.captions"')
          s=s.replace('name = "UserXYZ Patches"', 'name = "Morphe Universal Captions"')
          s=s.replace('description = "Patches for apps I like"', 'description = "Native YouTube captions and remembered subtitle language"')
          s=s.replace('source = "git@github.com:UserXYZ/morphe-patches.git"', 'source = "https://github.com/itolkien/morphe-universal-captions"')
          s=s.replace('author = "Awesome dev"', 'author = "itolkien"')
          s=s.replace('contact = "na"', 'contact = "https://github.com/itolkien/morphe-universal-captions/issues"')
          s=s.replace('website = "na"', 'website = "https://github.com/itolkien/morphe-universal-captions"')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build installable patch bundle
        working-directory: template
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon
          find patches/build/libs -maxdepth 1 -name '*.mpp' -type f -printf '%f\n'
      - name: Upload Morphe Manager MPP
        uses: actions/upload-artifact@v4
        with:
          name: universal-captions-1.3.0-youtube-mpp
          path: template/patches/build/libs/patches-1.3.0.mpp
          if-no-files-found: error
          retention-days: 14

      - name: Publish YouTube-scoped MPP release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp template/patches/build/libs/patches-1.3.0.mpp universal-captions-1.3.0.mpp
          if ! gh release view v1.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.3.0 universal-captions-1.3.0.mpp \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Universal Captions v1.3.0 - YouTube" \
              --notes "Adds native auto-translation language options and remembers subtitle language or Off across videos. Prefers target-language manual captions, then ASR; otherwise selects a suitable native track for YouTube translation. Tested on YouTube 21.20.405 with Waydroid; other versions and edge cases unverified. No external translation API."
          fi

      - name: Publish remote source metadata
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import json, datetime
          from pathlib import Path
          version = "1.3.0"
          repo = "itolkien/morphe-universal-captions"
          data = {
              "created_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S"),
              "description": "Native auto-translated caption languages for YouTube 21.20.405. Remembered language and native selection.",
              "download_url": f"https://github.com/{repo}/releases/download/v{version}/universal-captions-{version}.mpp",
              "signature_download_url": "",
              "version": version,
          }
          Path("addon/patches-bundle.json").write_text(json.dumps(data, indent=2) + chr(10))
          patch_list = Path("template/patches-list.json")
          if patch_list.is_file():
              Path("addon/patches-list.json").write_bytes(patch_list.read_bytes())
          PY
          cd addon
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches-bundle.json patches-list.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish v1.3.0 remote patch metadata"
            git push origin HEAD:main
          fi
