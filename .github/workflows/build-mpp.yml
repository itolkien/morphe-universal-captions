name: Build Universal Captions MPP
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - '.github/workflows/build-mpp.yml'
      - 'patches-list.json'
      - 'patches-bundle.json'
      - 'docs/RELEASE_*.md'
      - 'NOTICE'
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: addon
      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json,re; v=json.load(open("addon/patches-list.json"))["version"]; assert re.fullmatch(r"[0-9]+[.][0-9]+[.][0-9]+", v), v; print(v)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Checkout Morphe official template
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches-template
          ref: d4fa1045bf336c91b3e358a3b4a165395fc62229 # audited template; update deliberately
          path: template
      - name: Inject the independent patch
        run: |
          rm -rf template/patches/src/main/kotlin/app/template/patches/example
          mkdir -p template/patches/src/main/kotlin/dev/itolkien/captions/patches
          cp addon/patches/src/main/kotlin/dev/itolkien/captions/patches/*.kt template/patches/src/main/kotlin/dev/itolkien/captions/patches/
          mkdir -p template/extensions/extension/src/main/java/dev/itolkien/captions/extension
          cp addon/extensions/extension/src/main/java/dev/itolkien/captions/extension/*.java template/extensions/extension/src/main/java/dev/itolkien/captions/extension/
          sed -i "s/^version = .*/version = $RELEASE_VERSION/" template/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p=Path("template/patches/build.gradle.kts")
          s=p.read_text()
          s=s.replace('group = "app.template"', 'group = "dev.itolkien.captions"')
          s=s.replace('name = "UserXYZ Patches"', 'name = "Universal Captions"')
          s=s.replace('description = "Patches for apps I like"', 'description = "Native YouTube translation languages and missing menu fallback; caption preferences remain managed by Morphe."')
          s=s.replace('source = "git@github.com:UserXYZ/morphe-patches.git"', 'source = "https://github.com/itolkien/universal-captions"')
          s=s.replace('author = "Awesome dev"', 'author = "itolkien"')
          s=s.replace('contact = "na"', 'contact = "https://github.com/itolkien/universal-captions/issues"')
          s=s.replace('website = "na"', 'website = "https://github.com/itolkien/universal-captions"')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build installable patch bundle
        working-directory: template
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:generatePatchesList --no-daemon
          ./gradlew :patches:buildAndroid --no-daemon
          # Morphe's Section 7 notice must accompany redistributed derivative binaries.
          python3 - <<'PYNOTICE'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          bundle = Path("patches/build/libs") / f"patches-{os.environ['RELEASE_VERSION']}.mpp"
          notice = Path("../addon/NOTICE").read_bytes()
          with ZipFile(bundle, "a") as archive:
              if "NOTICE" in archive.namelist():
                  assert archive.read("NOTICE") == notice
              else:
                  archive.writestr("NOTICE", notice)
          PYNOTICE
          python3 ../addon/scripts/verify_android_bundle.py patches/build/libs/patches-$RELEASE_VERSION.mpp
          find patches/build/libs -maxdepth 1 -name '*.mpp' -type f -printf '%f\n'
      - name: Verify generated compatibility metadata
        run: |
          python3 - <<'PYMETA'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("template/patches-list.json").read_text())
          assert data["version"] == os.environ["RELEASE_VERSION"], data["version"]
          patches = [p for p in data["patches"] if p["name"].startswith("Universal Captions")]
          assert len(patches) == 1, patches
          packages = patches[0]["compatiblePackages"]
          assert len(packages) == 1 and packages[0]["packageName"] == "com.google.android.youtube"
          targets = {t["version"]: t for t in packages[0]["targets"]}
          assert set(targets) == {"21.20.405", "21.41.525"}, targets
          assert not targets["21.20.405"]["isExperimental"]
          assert not targets["21.41.525"]["isExperimental"]
          PYMETA
      - name: Release preflight (metadata and bundle)
        run: |
          set -euo pipefail
          # The main-branch publisher checks byte-for-byte metadata equality.
          # Exercise that gate on pull requests instead of discovering a mismatch after merge.
          cmp addon/patches-list.json template/patches-list.json
          test -s "addon/docs/RELEASE_$RELEASE_VERSION.md"
          test -s addon/NOTICE
          python3 - <<'PYSOURCE'
          import json
          import os
          from pathlib import Path
          version = os.environ["RELEASE_VERSION"]
          feed = json.loads(Path("addon/patches-bundle.json").read_text())
          assert feed["version"] == version, "Manager bundle version mismatch"
          expected = (f"https://github.com/itolkien/universal-captions/"
                      f"releases/download/v{version}/universal-captions-{version}.mpp")
          assert feed["download_url"] == expected, "Manager download URL mismatch"
          PYSOURCE
          python3 addon/scripts/verify_android_bundle.py "template/patches/build/libs/patches-$RELEASE_VERSION.mpp"
          sha256sum "template/patches/build/libs/patches-$RELEASE_VERSION.mpp"

      - name: Upload Morphe Manager MPP
        uses: actions/upload-artifact@v4
        with:
          name: universal-captions-${{ steps.version.outputs.version }}-youtube-mpp
          path: template/patches/build/libs/patches-${{ steps.version.outputs.version }}.mpp
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated patch metadata
        uses: actions/upload-artifact@v4
        with:
          name: universal-captions-${{ steps.version.outputs.version }}-metadata
          path: template/patches-list.json
          if-no-files-found: error
          retention-days: 14


      # The release job has its own write permission. PR builds stay read-only.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Check for an existing release
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$RELEASE_VERSION is already published; leaving its assets unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the verified Android bundle
        if: steps.current.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: universal-captions-${{ needs.build.outputs.version }}-youtube-mpp
          path: dist
      - name: Download generated patch metadata
        if: steps.current.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: universal-captions-${{ needs.build.outputs.version }}-metadata
          path: dist
      - name: Verify release files and write checksum
        if: steps.current.outputs.exists == 'false'
        run: |
          set -euo pipefail
          cmp patches-list.json dist/patches-list.json
          test "$(python3 -c 'import json; print(json.load(open("dist/patches-list.json"))["version"])')" = "$RELEASE_VERSION"
          mv "dist/patches-$RELEASE_VERSION.mpp" "dist/universal-captions-$RELEASE_VERSION.mpp"
          python3 scripts/verify_android_bundle.py "dist/universal-captions-$RELEASE_VERSION.mpp"
          (cd dist && sha256sum "universal-captions-$RELEASE_VERSION.mpp" > "universal-captions-$RELEASE_VERSION.mpp.sha256")
      - name: Publish new version
        if: steps.current.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Universal Captions $RELEASE_VERSION" \
            --notes-file "docs/RELEASE_$RELEASE_VERSION.md" \
            "dist/universal-captions-$RELEASE_VERSION.mpp" \
            "dist/universal-captions-$RELEASE_VERSION.mpp.sha256" \
            dist/patches-list.json
