name: Validate upstream Morphe captions

on:
  push:
    branches: [refactor/morphe-native-source]
  pull_request:
    branches: [refactor/morphe-native-source]
  workflow_dispatch:
    inputs:
      morphe_ref:
        description: Morphe branch, tag or commit to validate
        type: string
        default: dev
        required: true
      build_mpp:
        description: Build official Morphe MPP for manual APK testing
        type: boolean
        default: false
        required: false

concurrency:
  group: captions-upstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  captions:
    name: Test official Morphe captions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Universal Captions test sources
        uses: actions/checkout@v4
        with:
          path: captions
          persist-credentials: false

      - name: Checkout official Morphe (no fork or source overrides)
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.morphe_ref || 'dev' }}
          path: morphe
          persist-credentials: false

      - name: Record the exact upstream revision
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C morphe rev-parse HEAD)"
          echo "MORPHE_SHA=$sha" >> "$GITHUB_ENV"
          printf '%s\n' "$sha" > morphe-commit.txt
          {
            echo '### Official Morphe captions'
            echo
            echo "Tested Morphe revision: $sha"
            echo
            echo 'Only an additional caption test file is copied into the checkout.'
            echo 'No Morphe Java/Kotlin production source is replaced.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add caption regressions (test-only)
        shell: bash
        run: |
          set -euo pipefail
          source="captions/tests/upstream/MorpheCaptionUpstreamRegressionTest.java"
          destination="morphe/extensions/youtube/src/test/java/app/morphe/extension/youtube/patches/MorpheCaptionUpstreamRegressionTest.java"
          test -s "$source"
          test -d "$(dirname "$destination")"
          test ! -e "$destination"
          test -f morphe/extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/AutoTranslateCaptionsPatch.java
          test -f morphe/extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/TranslatedCaptionPensPatch.java
          cp "$source" "$destination"
          cmp "$source" "$destination"
          git -C morphe diff --exit-code --quiet
          echo 'Supplemental tests installed; upstream production sources are untouched.'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test upstream Kotlin/Java and extra caption regressions
        working-directory: morphe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test :extensions:youtube:testDebugUnitTest --no-daemon

      - name: Build official MPP (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mpp }}
        working-directory: morphe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:generatePatchesList :patches:buildAndroid --no-daemon

      - name: Verify optional official Morphe MPP
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mpp }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          root = Path('morphe')
          packages = sorted((root / 'patches/build/libs').glob('*.mpp'))
          assert len(packages) == 1, f'Expected one Morphe MPP, found {packages}'
          with ZipFile(packages[0]) as bundle:
              names = bundle.namelist()
              assert bundle.testzip() is None, 'Corrupt MPP'
              assert 'classes.dex' in names, 'Missing patch bytecode'
              assert any(n.startswith('extensions/') and n.endswith('.mpe') for n in names), 'Missing extension'
          manifest = json.loads((root / 'patches-list.json').read_text())
          assert any(p['name'] == 'Captions' for p in manifest['patches']), 'Missing Captions patch'
          print(f'Official Morphe bundle checked: {packages[0]}')
          PY

      - name: Upload manual Morphe MPP test artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mpp }}
        uses: actions/upload-artifact@v4
        with:
          name: official-morphe-captions-${{ github.run_id }}
          path: |
            morphe/patches/build/libs/*.mpp
            morphe/patches-list.json
            morphe-commit.txt
          if-no-files-found: error
          retention-days: 14
