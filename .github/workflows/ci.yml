name: Caption regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - name: Test menu runtime and structural bytecode resolution
        run: gradle -p tests/fingerprints test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fingerprint-test-results
          path: tests/fingerprints/build/reports/tests/test
          if-no-files-found: ignore
